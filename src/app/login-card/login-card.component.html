<div class="login-card">

  <!-- Toast popup -->
  <div class="toast-message"
       *ngIf="showToast"
       [class.error-toast]="toastMessage.includes('failed')">

    <span class="toast-icon">
      {{ toastMessage.includes('failed') ? '✕' : '✓' }}
    </span>

    {{ toastMessage }}
  </div>



  <div *ngIf="showflag">
    <p>Sign in to continue</p>

    <form (ngSubmit)="dologin({
      username: username,
      password: password
    })">

      <div class="form-group">
        <label for="email">Email</label>
        <input
          id="email"
          type="text"
          name="username"
          [(ngModel)]="username"
          placeholder="Enter your username"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          required
        />
      </div>

      <button type="submit">Login</button>
    </form>
  </div>

  <div *ngIf="!showflag">
    <h1>Welcome {{ username }}</h1>
    <h1>Mobile Number: {{ mobile }}</h1>
  </div>

</div>
